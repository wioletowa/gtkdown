[package]
name = "gtkdown"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
sourceview5 = { version = "0.11", features = ["v5_16"] }
pulldown-cmark = { version = "0.13", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
